services:
  postgres:
    image: postgres:17-alpine
    container_name: server-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: server_db
    ports:
      - "5432:5432"
    volumes:
      - server_pg_data:/var/lib/postgresql/data

volumes:
  server_pg_data: